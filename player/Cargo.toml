[package]
name = "sequencer-player"
version = "1.0.0"
edition = "2024"
description = "The Sequencer engine as WebAssembly, so omarchysequencer.com can play shared songs"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
omarchy-sequencer = { path = "..", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
