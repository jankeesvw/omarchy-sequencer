[package]
name = "sequencer"
version = "0.1.0"
edition = "2024"
description = "A step sequencer for Omarchy, with TR-808 drums, riffs, 90s rave samples and your own recordings"
license = "MIT"
repository = "https://github.com/jankeesvw/sequencer"
readme = "README.md"

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fastrand = "2.5.0"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
